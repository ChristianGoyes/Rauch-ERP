name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore backend/RauchERP.slnx
      - run: dotnet build backend/RauchERP.slnx --configuration Release --no-restore
      - run: dotnet test backend/tests/RauchERP.UnitTests --configuration Release --no-build
      - run: dotnet test backend/tests/RauchERP.ArchitectureTests --configuration Release --no-build
      - run: dotnet test backend/tests/RauchERP.FunctionalTests --configuration Release --no-build
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.16.0, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --watch=false
